<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="_content/ShineBlazor.Components/css/shine.css" rel="stylesheet" />
    <link href="_content/ShineBlazor.Components/css/code.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link href="ShineBlazor.Components.Demo.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="splash-wrapper bg-dark">
            <div class="splash">
                <img src="./images/shine.svg" alt="Shine Blazor" class="logo text-primary" />
                <div class="progress">
                    <div class="progress-bar"></div>
                </div>
                <div class="progress-text text-light"></div>
            </div>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/ShineBlazor.Components/js/shine.js"></script>
    <script src="_content/ShineBlazor.Components/InfiniteScroll.razor.js" type="module"></script>
    <script src="highlight/highlight.min.js"></script>
    <script src="highlight/languages/csharp.min.js"></script>
    <script src="highlight/languages/xml.min.js"></script>
    <script>
        window.highlightCode = (elementId) => {
            const element = document.getElementById(elementId);
            if (element) {
                hljs.highlightElement(element);
            }
        };
    </script>
</body>

</html>
