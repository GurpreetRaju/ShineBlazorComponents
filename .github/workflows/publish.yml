name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'  # Triggers when a tag like v1.0.0 is pushed

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build ShineBlazor.Components/ShineBlazor.Components.csproj  --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack ShineBlazor.Components/ShineBlazor.Components.csproj  --configuration Release --no-build --output nupkgs

      - name: Publish to NuGet
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
